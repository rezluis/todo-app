<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <main class="app">
        <h1 class="app__title">Lista de Tarefas</h1>

        <form id="task-form" class="task-form" autocomplete="off">
            <label for="title-input" class="sr-only">Título da tarefa</label>
            <input id="title-input" class="task-form__input task-form__input--title"
                   type="text" maxlength="120"
                   placeholder="O que precisa ser feito?" aria-required="false">
            <label for="description-input" class="sr-only">Descrição (opcional)</label>
            <input id="description-input" class="task-form__input"
                   type="text" placeholder="Descrição (opcional)">
            <button type="submit" class="task-form__submit">Adicionar</button>
        </form>

        <p id="error-message" class="error-message" role="alert" hidden></p>

        <ul id="task-list" class="task-list"></ul>

        <p id="empty-state" class="empty-state" hidden>
            Nenhuma tarefa por aqui. Crie a primeira acima!
        </p>
    </main>

    <script type="module" src="js/app.js"></script>
</body>
</html>
