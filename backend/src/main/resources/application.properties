spring.application.name=todo-backend

spring.datasource.url=jdbc:sqlite:${DB_PATH:/data/todo.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.connection-init-sql=PRAGMA journal_mode=WAL; PRAGMA synchronous=NORMAL; PRAGMA foreign_keys=ON

spring.sql.init.mode=always

server.port=8080