services:
  backend:
    build: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:sqlite:/data/todo.db
    volumes:
      - todo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/api/tasks || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  todo-data: